name: EAS Update

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    # Runs when a PR is merged into main (merge = push to main)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        env:
          # Inlined into the JS bundle at publish time (repo Settings > Variables)
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || format('Manual update ({0})', github.sha) }}
        run: eas update --branch production --message "$COMMIT_MESSAGE" --non-interactive
