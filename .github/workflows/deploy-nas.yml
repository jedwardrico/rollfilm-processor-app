name: Deploy server to NAS

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-nas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner installed on the NAS (the NAS is only reachable on the LAN)
    runs-on: [self-hosted, nas]
    env:
      # Must match the project name of the existing deployment, otherwise compose
      # creates a new, empty data volume. Check with `docker volume ls`.
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'rollfilm-processor-app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart server
        run: docker compose up -d --build rollfilm-server

      - name: Remove dangling images
        run: docker image prune -f
