services:
  rollfilm-server:
    image: ghcr.io/jedwardrico/rollfilm-server:latest
    build: ./server
    container_name: rollfilm-server
    ports:
      - "3000:3000"
    volumes:
      - rollfilm-data:/data
    environment:
      - DB_PATH=/data/rollfilm.db
      - PORT=3000
    restart: unless-stopped

volumes:
  rollfilm-data:
    driver: local
